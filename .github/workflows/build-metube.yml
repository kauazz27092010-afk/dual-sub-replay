name: Build MeTube APK (fixed signing)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-metube-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea805825da76410c181273ba90b1 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore fixed debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${DEBUG_KEYSTORE_BASE64:-}" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$HOME/.android/debug.keystore"
            echo "Fixed debug keystore restored."
          else
            echo "Warning: DEBUG_KEYSTORE_BASE64 secret is not set; using ephemeral debug keystore."
          fi

      - name: Build MeTube APK
        run: |
          set -euo pipefail
          version_code=$(( $(date -u +%s) - 1700000000 ))
          bash ./gradlew assembleDebug \
            -PpreviewVersionCode="$version_code" \
            -PpreviewVersionNameSuffix="-metube-build${GITHUB_RUN_NUMBER}" \
            -PpreviewApplicationIdSuffix=".preview" \
            --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk MeTube.apk

      - name: Upload MeTube APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MeTube-APK
          path: MeTube.apk
          if-no-files-found: error
          retention-days: 30
